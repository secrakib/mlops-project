name: Training Pipeline

on:
  push:
    paths:
      - 'src/**'
      - 'data/*.dvc'
      - '.github/workflows/train.yml'
  schedule:
    - cron: '0 0 * * 0' # Weekly retrain if needed
  workflow_dispatch:

jobs:
  train:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'requirements-*.txt'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-train.txt -r requirements-serve.txt

      - name: Configure DVC and MLflow Credentials
        env:
          DAGSHUB_USER: ${{ secrets.DAGSHUB_USER }}
          DAGSHUB_TOKEN: ${{ secrets.DAGSHUB_TOKEN }}
        run: |
          # DVC uses S3 auth for DagsHub
          dvc remote modify origin --local access_key_id $DAGSHUB_TOKEN
          dvc remote modify origin --local secret_access_key $DAGSHUB_TOKEN

      - name: Pull Data from DVC
        run: dvc pull

      - name: Run Prefect Training Flow
        env:
          DAGSHUB_USER: ${{ secrets.DAGSHUB_USER }}
          DAGSHUB_TOKEN: ${{ secrets.DAGSHUB_TOKEN }}
          DAGSHUB_REPO: ${{ secrets.DAGSHUB_REPO }}
        run: |
          python -m src.training.flow

      - name: Run Model Sanity Checks on New Staging Model
        env:
          DAGSHUB_USER: ${{ secrets.DAGSHUB_USER }}
          DAGSHUB_TOKEN: ${{ secrets.DAGSHUB_TOKEN }}
          DAGSHUB_REPO: ${{ secrets.DAGSHUB_REPO }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python -m pytest tests/test_model_sanity.py

      - name: Promote Model to Production
        env:
          MLFLOW_TRACKING_URI: https://dagshub.com/${{ secrets.DAGSHUB_USER }}/mlops-project-dataset.mlflow
          MLFLOW_TRACKING_USERNAME: ${{ secrets.DAGSHUB_USER }}
          MLFLOW_TRACKING_PASSWORD: ${{ secrets.DAGSHUB_TOKEN }}
        run: |
          python -c "
          import os
          from mlflow.tracking import MlflowClient
          client = MlflowClient()
          model_name = 'credit-risk-model'
          try:
              staging_model = client.get_model_version_by_alias(model_name, 'Staging')
              client.set_registered_model_alias(model_name, 'Production', staging_model.version)
              print(f'Successfully promoted version {staging_model.version} of {model_name} to Production alias.')
          except Exception as e:
              print(f'Warning: Could not promote model: {e}')
          "
