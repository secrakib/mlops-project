data:
  path: "data/dataset.csv"
  target_col: "loan_status"
  split_dates:
    val_start: "2017-05-01"
    test_start: "2017-11-01"

features:
  leakage_cols: 
    - "total_pymnt"
    - "recoveries"
    - "last_pymnt_amnt"
    - "collection_recovery_fee"

model:
  xgboost_grid:
    max_depth: [3, 5]
    learning_rate: [0.01, 0.1]
    n_estimators: [100]

evaluation:
  cost_matrix:
    fn_cost: 10
    fp_cost: 1
