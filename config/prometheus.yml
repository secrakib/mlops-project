global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'fastapi'
    static_configs:
      - targets: ['api:8000']
        
  - job_name: 'pushgateway'
    static_configs:
      - targets: ['pushgateway:9091']

remote_write:
  - url: "${GRAFANA_CLOUD_URL}"
    basic_auth:
      username: "${GRAFANA_CLOUD_USER}"
      password: "${GRAFANA_CLOUD_API_KEY}"
