name: CD Pipeline

on:
  workflow_run:
    workflows: ["CI Pipeline", "Training Pipeline"]
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  check-prerequisites:
    runs-on: ubuntu-latest
    outputs:
      should_deploy: ${{ steps.gatekeeper.outputs.should_deploy }}
    steps:
      - name: Evaluate Workflow Statuses
        id: gatekeeper
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual dispatch triggered. Authorizing deployment."
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          TRIGGER_NAME="${{ github.event.workflow_run.name }}"
          TRIGGER_CONCLUSION="${{ github.event.workflow_run.conclusion }}"
          HEAD_SHA="${{ github.event.workflow_run.head_sha }}"

          echo "Triggered by: $TRIGGER_NAME (Conclusion: $TRIGGER_CONCLUSION) on commit $HEAD_SHA"

          if [ "$TRIGGER_CONCLUSION" != "success" ]; then
            echo "Triggering workflow did not succeed ($TRIGGER_CONCLUSION). Halting CD."
            echo "should_deploy=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          # Query all workflow runs for this specific commit
          RUNS=$(gh run list --commit "$HEAD_SHA" --json name,status,conclusion)
          echo "Current workflow statuses on commit $HEAD_SHA:"
          echo "$RUNS" | jq .

          CI_RUN=$(echo "$RUNS" | jq -r '[.[] | select(.name=="CI Pipeline")] | first')
          TRAIN_RUN=$(echo "$RUNS" | jq -r '[.[] | select(.name=="Training Pipeline")] | first')

          CI_STATUS=$(echo "$CI_RUN" | jq -r '.status // empty')
          CI_CONCLUSION=$(echo "$CI_RUN" | jq -r '.conclusion // empty')

          TRAIN_STATUS=$(echo "$TRAIN_RUN" | jq -r '.status // empty')
          TRAIN_CONCLUSION=$(echo "$TRAIN_RUN" | jq -r '.conclusion // empty')

          echo "CI Pipeline: status=$CI_STATUS, conclusion=$CI_CONCLUSION"
          echo "Training Pipeline: status=$TRAIN_STATUS, conclusion=$TRAIN_CONCLUSION"

          # If either workflow is still in progress or queued, gracefully skip.
          # The completing workflow will trigger CD.
          if [ "$CI_STATUS" = "in_progress" ] || [ "$CI_STATUS" = "queued" ] || [ "$TRAIN_STATUS" = "in_progress" ] || [ "$TRAIN_STATUS" = "queued" ]; then
            echo "Prerequisite workflows are still in progress. Skipping this trigger."
            echo "should_deploy=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Count how many prerequisite workflows were triggered
          NUM_TRIGGERED=0
          if [ -n "$CI_STATUS" ]; then
            NUM_TRIGGERED=$((NUM_TRIGGERED + 1))
          fi
          if [ -n "$TRAIN_STATUS" ]; then
            NUM_TRIGGERED=$((NUM_TRIGGERED + 1))
          fi
          
          echo "Number of prerequisite workflows triggered: $NUM_TRIGGERED"
          
          if [ "$NUM_TRIGGERED" -eq 0 ]; then
            echo "No prerequisite workflows triggered. Halting."
            echo "should_deploy=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          
          if [ "$NUM_TRIGGERED" -eq 2 ]; then
            # Both triggered
            if [ "$CI_CONCLUSION" = "success" ] && [ "$TRAIN_CONCLUSION" = "success" ]; then
              echo "Both workflows succeeded! Authorizing deployment."
              echo "should_deploy=true" >> "$GITHUB_OUTPUT"
              exit 0
            else
              echo "One or both workflows did not succeed. Halting."
              echo "should_deploy=false" >> "$GITHUB_OUTPUT"
              exit 1
            fi
          elif [ "$NUM_TRIGGERED" -eq 1 ]; then
            # Only one triggered
            if [ -n "$CI_STATUS" ] && [ "$CI_CONCLUSION" = "success" ]; then
              echo "Only CI Pipeline triggered and it succeeded! Authorizing deployment."
              echo "should_deploy=true" >> "$GITHUB_OUTPUT"
              exit 0
            elif [ -n "$TRAIN_STATUS" ] && [ "$TRAIN_CONCLUSION" = "success" ]; then
              echo "Only Training Pipeline triggered and it succeeded! Authorizing deployment."
              echo "should_deploy=true" >> "$GITHUB_OUTPUT"
              exit 0
            else
              echo "The triggered workflow did not succeed. Halting."
              echo "should_deploy=false" >> "$GITHUB_OUTPUT"
              exit 1
            fi
          fi

  build-and-push:
    needs: check-prerequisites
    if: needs.check-prerequisites.outputs.should_deploy == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata for API Image
        id: meta-api
        uses: docker/metadata-action@v5
        with:
          images: rakibullahboom/mlops-api
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-,format=short

      - name: Build and push API Image
        uses: docker/build-push-action@v5
        with:
          context: .
          target: api
          push: true
          tags: ${{ steps.meta-api.outputs.tags }}
          labels: ${{ steps.meta-api.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Extract metadata for Frontend Image
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: rakibullahboom/mlops-frontend
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-,format=short

      - name: Build and push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: .
          target: frontend
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
